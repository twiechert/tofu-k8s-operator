image:
  repository: ghcr.io/twiechert/tofu-k8s-operator
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

metricsBindAddress: ":8080"
healthProbeBindAddress: ":8081"
leaderElect: false

serviceMonitor:
  enabled: false
  interval: "30s"
  labels: {}
  namespace: ""

prometheusRule:
  enabled: false
  labels: {}
  namespace: ""
  groups:
    health:
      enabled: true
      errorFor: "5m"
    drift:
      enabled: true
      detectedFor: "5m"
    blastRadius:
      enabled: true
      threshold: 10
    reconcile:
      enabled: true
      errorFor: "15m"
      applyFailureThreshold: 2
    approval:
      enabled: true
      waitingFor: "24h"
