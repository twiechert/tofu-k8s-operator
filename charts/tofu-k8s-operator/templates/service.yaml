apiVersion: v1
kind: Service
metadata:
  name: tofu-k8s-operator-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: tofu-k8s-operator
spec:
  type: ClusterIP
  selector:
    app: tofu-k8s-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
