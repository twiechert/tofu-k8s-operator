apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tofuprograms.tofu.example.com
spec:
  group: tofu.example.com
  names:
    kind: TofuProgram
    listKind: TofuProgramList
    plural: tofuprograms
    singular: tofuprogram
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                programHCL:
                  type: string
                source:
                  type: object
                  required: ["url"]
                  properties:
                    url: {type: string}
                    ref: {type: string}
                    path: {type: string}
                    credentialsSecretRef:
                      type: object
                      required: ["name"]
                      properties:
                        name: {type: string}
                providers:
                  type: array
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name: {type: string}
                      source: {type: string}
                      version: {type: string}
                      configHCL: {type: string}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
      subresources:
        status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tofuprojects.tofu.example.com
spec:
  group: tofu.example.com
  names:
    kind: TofuProject
    listKind: TofuProjectList
    plural: tofuprojects
    singular: tofuproject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["programRef"]
              properties:
                programRef:
                  type: object
                  required: ["name"]
                  properties:
                    name: {type: string}
                    namespace: {type: string}
                params:
                  type: object
                  additionalProperties:
                    type: string
                paramFrom:
                  type: array
                  description: "Bulk import all keys from ConfigMaps/Secrets as params (lowest precedence)"
                  items:
                    type: object
                    properties:
                      configMapRef:
                        type: object
                        required: ["name"]
                        properties:
                          name: {type: string}
                          namespace: {type: string}
                      secretRef:
                        type: object
                        required: ["name"]
                        properties:
                          name: {type: string}
                          namespace: {type: string}
                paramBindings:
                  type: array
                  description: "Map individual ConfigMap/Secret keys to named params (medium precedence)"
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name: {type: string}
                      configMapKeyRef:
                        type: object
                        required: ["name", "key"]
                        properties:
                          name: {type: string}
                          key: {type: string}
                      secretKeyRef:
                        type: object
                        required: ["name", "key"]
                        properties:
                          name: {type: string}
                          key: {type: string}
                valuesFrom:
                  type: array
                  description: "Ordered list of ConfigMaps/Secrets to import as params. Later entries override earlier ones. Lowest precedence."
                  items:
                    type: object
                    properties:
                      configMapRef:
                        type: string
                        description: "Name of a ConfigMap to import all keys from"
                      secretRef:
                        type: string
                        description: "Name of a Secret to import all keys from"
                workspace: {type: string}
                image: {type: string}
                autoApprove: {type: boolean}
                autoApproveMaxBlastRadius:
                  type: integer
                  format: int32
                  description: "Auto-approve plans when total affected resources (add+change+destroy) is at or below this threshold. Only meaningful when autoApprove is false. nil = manual approval always required; 0 = auto-approve only 'No changes' plans."
                applyImmediately:
                  type: boolean
                  description: "When true (default), the Ready condition stays False until apply succeeds or errors. Set to false for async execution (e.g. ArgoCD)."
                suspend: {type: boolean}
                deleteProtection:
                  type: boolean
                  description: "When true, deletion is blocked until explicitly approved"
                serviceAccount:
                  type: object
                  properties:
                    name:
                      type: string
                      description: "Use an existing ServiceAccount instead of auto-creating one"
                    annotations:
                      type: object
                      additionalProperties: {type: string}
                      description: "Annotations to add to the auto-created ServiceAccount"
                backend:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [kubernetes, s3]
                    secretSuffix: {type: string}
                    namespace: {type: string}
                    s3:
                      type: object
                      required: [bucket, region]
                      properties:
                        bucket: {type: string}
                        region: {type: string}
                        key: {type: string}
                keepInSync:
                  type: boolean
                  description: "If true, the controller will run 'tofu apply' instead of 'tofu plan' in the sync loop."
                syncInterval:
                  type: string
                  description: "How often to re-reconcile after a successful sync (e.g. '5m', '1h'). Default: no periodic requeue."
                dependencies:
                  type: array
                  items:
                    type: object
                    required: ["projectRef", "outputs"]
                    properties:
                      projectRef:
                        type: object
                        required: ["name"]
                        properties:
                          name: {type: string}
                          namespace: {type: string}
                      outputs:
                        type: object
                        additionalProperties: {type: string}
                cache:
                  type: object
                  properties:
                    mode:
                      type: string
                      description: "'shared' or 'dedicated'"
                    size: {type: string}
                    storageClass: {type: string}
                env:
                  type: array
                  description: "Extra environment variables injected into tofu Job containers"
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name: {type: string}
                      value: {type: string}
                      valueFrom:
                        type: object
                        properties:
                          configMapKeyRef:
                            type: object
                            properties:
                              name: {type: string}
                              key: {type: string}
                          secretKeyRef:
                            type: object
                            properties:
                              name: {type: string}
                              key: {type: string}
                          fieldRef:
                            type: object
                            properties:
                              fieldPath: {type: string}
                envFrom:
                  type: array
                  description: "Bulk env import from ConfigMaps/Secrets"
                  items:
                    type: object
                    properties:
                      prefix: {type: string}
                      configMapRef:
                        type: object
                        properties:
                          name: {type: string}
                      secretRef:
                        type: object
                        properties:
                          name: {type: string}
                extraVolumes:
                  type: array
                  description: "Extra volumes added to tofu Job pods"
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                extraVolumeMounts:
                  type: array
                  description: "Extra volume mounts added to the tofu container"
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                resources:
                  type: object
                  description: "Resource requests/limits for tofu Job containers"
                  properties:
                    limits:
                      type: object
                      additionalProperties: {type: string}
                    requests:
                      type: object
                      additionalProperties: {type: string}
                retryPolicy:
                  type: object
                  description: "Retry failed Jobs before marking as Error"
                  properties:
                    maxRetries:
                      type: integer
                      format: int32
                    delay:
                      type: string
                      description: "Delay between retries (e.g. '30s', '1m'). Default: 30s"
                jobTimeout:
                  type: string
                  description: "Maximum duration a Job is allowed to run (e.g. '30m', '1h'). Default: 30m."
                driftDetection:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    interval:
                      type: string
                      description: "How often to check for drift (e.g. '15m', '1h'). Default: 15m"
                notifications:
                  type: object
                  description: "Notification hooks for lifecycle events"
                  properties:
                    webhooks:
                      type: array
                      items:
                        type: object
                        required: ["url", "events"]
                        properties:
                          url: {type: string}
                          events:
                            type: array
                            items: {type: string}
                validation:
                  type: object
                  description: "Configure pre-apply validation (tofu validate + optional tool steps)"
                  properties:
                    tofuValidate:
                      type: boolean
                    steps:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string}
                          standard:
                            type: string
                            enum: [tflint, checkov, trivy]
                          custom:
                            type: object
                            required: [command]
                            properties:
                              command: {type: string}
                              image: {type: string}
                ignoreProviders:
                  type: boolean
                  description: "Strip all provider blocks from source .tf files"
                additionalProvidersHCL:
                  type: string
                  description: "Raw HCL for additional provider configuration, written as additional-providers.tf"
                revisionHistoryLimit:
                  type: integer
                  format: int32
                  description: "Maximum number of revision ConfigMaps to retain. Default: 10. 0 = keep all."
                pinnedRevision:
                  type: integer
                  format: int32
                  description: "Pin to a stored revision for rollback. 0 = normal flow."
                applySchedule:
                  type: object
                  description: "Gate when approved plans are applied. Plans auto-apply only during the configured maintenance window."
                  required: [schedule]
                  properties:
                    schedule:
                      type: string
                      description: "Cron expression defining when the apply window opens, e.g. '0 2 * * *'"
                    window:
                      type: string
                      description: "How long the apply window stays open after the cron fires. Default: 1h"
                ttl:
                  type: string
                  description: "How long the project lives after creation before auto-deletion (e.g. '24h', '168h'). Empty = no TTL."
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                lastJobName: {type: string}
                lastAppliedHash: {type: string}
                revision: {type: integer, format: int32}
                phase: {type: string}
                message: {type: string}
                syncStatus:
                  type: string
                  description: "Indicates if the project is in sync with the desired state ('sync' or 'not in sync')"
                pendingPlanHash: {type: string}
                planOutput: {type: string}
                planSummary: {type: string}
                lastPlanJobName: {type: string}
                outputs:
                  type: object
                  additionalProperties: {type: string}
                retryCount: {type: integer, format: int32}
                lastDriftCheckTime: {type: string, format: date-time}
                driftDetected: {type: boolean}
                blastRadius:
                  type: object
                  description: "Parsed blast radius from the latest plan summary"
                  properties:
                    add: {type: integer, format: int32}
                    change: {type: integer, format: int32}
                    destroy: {type: integer, format: int32}
                    total: {type: integer, format: int32}
                stateLocked: {type: boolean}
                expiresAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type: {type: string}
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
      subresources:
        status: {}
