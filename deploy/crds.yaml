apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tofuprograms.tofu.example.com
spec:
  group: tofu.example.com
  names:
    kind: TofuProgram
    listKind: TofuProgramList
    plural: tofuprograms
    singular: tofuprogram
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                programHCL:
                  type: string
                source:
                  type: object
                  required: ["url"]
                  properties:
                    url: {type: string}
                    ref: {type: string}
                    path: {type: string}
                    credentialsSecretRef:
                      type: object
                      required: ["name"]
                      properties:
                        name: {type: string}
                providers:
                  type: array
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name: {type: string}
                      source: {type: string}
                      version: {type: string}
                      configHCL: {type: string}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
      subresources:
        status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tofuprojects.tofu.example.com
spec:
  group: tofu.example.com
  names:
    kind: TofuProject
    listKind: TofuProjectList
    plural: tofuprojects
    singular: tofuproject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["programRef"]
              properties:
                programRef:
                  type: object
                  required: ["name"]
                  properties:
                    name: {type: string}
                    namespace: {type: string}
                params:
                  type: object
                  additionalProperties:
                    type: string
                paramFrom:
                  type: array
                  description: "Bulk import all keys from ConfigMaps/Secrets as params (lowest precedence)"
                  items:
                    type: object
                    properties:
                      configMapRef:
                        type: object
                        required: ["name"]
                        properties:
                          name: {type: string}
                          namespace: {type: string}
                      secretRef:
                        type: object
                        required: ["name"]
                        properties:
                          name: {type: string}
                          namespace: {type: string}
                paramBindings:
                  type: array
                  description: "Map individual ConfigMap/Secret keys to named params (medium precedence)"
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name: {type: string}
                      configMapKeyRef:
                        type: object
                        required: ["name", "key"]
                        properties:
                          name: {type: string}
                          key: {type: string}
                      secretKeyRef:
                        type: object
                        required: ["name", "key"]
                        properties:
                          name: {type: string}
                          key: {type: string}
                workspace: {type: string}
                image: {type: string}
                autoApprove: {type: boolean}
                applyImmediately:
                  type: boolean
                  description: "When true (default), the Ready condition stays False until apply succeeds or errors. Set to false for async execution (e.g. ArgoCD)."
                suspend: {type: boolean}
                deleteProtection:
                  type: boolean
                  description: "When true, deletion is blocked until explicitly approved"
                serviceAccount:
                  type: object
                  properties:
                    name:
                      type: string
                      description: "Use an existing ServiceAccount instead of auto-creating one"
                    annotations:
                      type: object
                      additionalProperties: {type: string}
                      description: "Annotations to add to the auto-created ServiceAccount"
                backend:
                  type: object
                  properties:
                    secretSuffix: {type: string}
                    namespace: {type: string}
                keepInSync:
                  type: boolean
                  description: "If true, the controller will run 'tofu apply' instead of 'tofu plan' in the sync loop."
                syncInterval:
                  type: string
                  description: "How often to re-reconcile after a successful sync (e.g. '5m', '1h'). Default: no periodic requeue."
                dependencies:
                  type: array
                  items:
                    type: object
                    required: ["projectRef", "outputs"]
                    properties:
                      projectRef:
                        type: object
                        required: ["name"]
                        properties:
                          name: {type: string}
                          namespace: {type: string}
                      outputs:
                        type: object
                        additionalProperties: {type: string}
                cache:
                  type: object
                  properties:
                    mode:
                      type: string
                      description: "'shared' or 'dedicated'"
                    size: {type: string}
                    storageClass: {type: string}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                lastJobName: {type: string}
                lastAppliedHash: {type: string}
                phase: {type: string}
                message: {type: string}
                syncStatus:
                  type: string
                  description: "Indicates if the project is in sync with the desired state ('sync' or 'not in sync')"
                pendingPlanHash: {type: string}
                planOutput: {type: string}
                planSummary: {type: string}
                lastPlanJobName: {type: string}
                outputs:
                  type: object
                  additionalProperties: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type: {type: string}
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
      subresources:
        status: {}
