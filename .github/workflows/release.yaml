name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/manager main.go

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/tofu-k8s-operator \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination .helm-pkg

      - name: Push Helm chart to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push .helm-pkg/tofu-k8s-operator-${VERSION}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Update Chart.yaml version on main
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed -i "s/^version:.*/version: ${VERSION}/" charts/tofu-k8s-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/tofu-k8s-operator/Chart.yaml
          git add charts/tofu-k8s-operator/Chart.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Chart.yaml to ${VERSION} [skip ci]"
            git push origin main
          fi
